<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Preinscripció — II Trobada ACCU Catalunya</title>
  
  <!-- Carrega oficial de Google reCAPTCHA v3 -->
  <script src="https://www.google.com/recaptcha/api.js?render=6Ldh0ogsAAAAAA51XBERJe51dEQoStsWCrVTTiux"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f4f6f9;
      color: #333;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .form-card {
      background: #ffffff;
      max-width: 550px;
      width: 100%;
      padding: 35px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
    }
    .form-card h1 {
      color: #6B21A8;
      font-size: 24px;
      text-align: center;
      margin-bottom: 8px;
    }
    .form-card p.subtitle {
      text-align: center;
      color: #666;
      font-size: 14px;
      margin-bottom: 25px;
    }
    .form-group {
      margin-bottom: 18px;
    }
    .form-group label {
      display: block;
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 6px;
      color: #444;
    }
    .form-group input, 
    .form-group select {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
      transition: border-color 0.2s;
    }
    .form-group input:focus, 
    .form-group select:focus {
      outline: none;
      border-color: #6B21A8;
    }
    .btn-submit {
      width: 100%;
      background-color: #6B21A8;
      color: white;
      padding: 14px;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
      transition: background-color 0.2s;
    }
    .btn-submit:hover {
      background-color: #581c87;
    }
    .btn-submit:disabled {
      background-color: #a78bfa;
      cursor: not-allowed;
    }
    .alert {
      padding: 14px;
      border-radius: 6px;
      font-size: 14px;
      margin-bottom: 20px;
      display: none;
    }
    .alert-success {
      background-color: #d1fae5;
      color: #065f46;
      border: 1px solid #a7f3d0;
    }
    .alert-error {
      background-color: #fee2e2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }
    .captcha-notice {
      font-size: 11px;
      color: #888;
      text-align: center;
      margin-top: 18px;
      line-height: 1.4;
    }
    .captcha-notice a {
      color: #6B21A8;
      text-decoration: none;
    }
  </style>
</head>
<body>

<div class="form-card">
  <h1>II Trobada ACCU Catalunya</h1>
  <p class="subtitle">Formulari de Preinscripció Oficial</p>

  <div id="alertSuccess" class="alert alert-success"></div>
  <div id="alertError" class="alert alert-error"></div>

  <form id="inscriptionForm">
    <div class="form-group">
      <label for="nomCognoms">Nom i Cognoms *</label>
      <input type="text" id="nomCognoms" required placeholder="Ex. Joan Garcia">
    </div>

    <div class="form-group">
      <label for="nif">NIF / DNI / NIE *</label>
      <input type="text" id="nif" required placeholder="Ex. 12345678X">
    </div>

    <div class="form-group">
      <label for="email">Correu electrònic *</label>
      <input type="email" id="email" required placeholder="Ex. joan@exemple.cat">
    </div>

    <div class="form-group">
      <label for="telefono">Telèfon de contacte *</label>
      <input type="tel" id="telefono" required placeholder="Ex. 600123456">
    </div>

    <div class="form-group">
      <label for="socio">Sou persona sòcia d'ACCU Catalunya? *</label>
      <select id="socio" required>
        <option value="si">Sí</option>
        <option value="no">No</option>
      </select>
    </div>

    <div class="form-group">
      <label for="dataNaixement">Data de naixement *</label>
      <input type="date" id="dataNaixement" required>
    </div>

    <button type="submit" id="submitBtn" class="btn-submit">Enviar Preinscripció (20 €)</button>

    <p class="captcha-notice">
      Aquest lloc està protegit per reCAPTCHA i s'apliquen la 
      <a href="https://policies.google.com/privacy" target="_blank">Política de Privadesa</a> i els 
      <a href="https://policies.google.com/terms" target="_blank">Termes del Servei</a> de Google.
    </p>
  </form>
</div>

<script>
  // URL del teu Web App desplegat a Google Apps Script
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycby.../exec"; // <-- Assegura't que conté la teva ID completa finalitzada en /exec
  const RECAPTCHA_SITE_KEY = "6Ldh0ogsAAAAAA51XBERJe51dEQoStsWCrVTTiux";

  const form = document.getElementById('inscriptionForm');
  const submitBtn = document.getElementById('submitBtn');
  const alertSuccess = document.getElementById('alertSuccess');
  const alertError = document.getElementById('alertError');

  form.addEventListener('submit', function(e) {
    e.preventDefault();

    alertSuccess.style.display = 'none';
    alertError.style.display = 'none';
    submitBtn.disabled = true;
    submitBtn.innerText = "Validant i enviant...";

    // Execució del reCAPTCHA v3
    grecaptcha.ready(function() {
      grecaptcha.execute(RECAPTCHA_SITE_KEY, { action: 'inscriure' }).then(function(token) {
        
        // Recopilació de dades del formulari
        const payload = {
          action: 'inscriure',
          recaptchaToken: token,
          data: {
            nomCognoms: document.getElementById('nomCognoms').value,
            nif: document.getElementById('nif').value,
            email: document.getElementById('email').value,
            telefono: document.getElementById('telefono').value,
            socio: document.getElementById('socio').value,
            dataNaixement: document.getElementById('dataNaixement').value,
            totalPreu: 20
          }
        };

        // Enviament de dades cap a Google Apps Script
        fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'text/plain;charset=utf-8'
          },
          body: JSON.stringify(payload)
        })
        .then(response => response.json())
        .then(result => {
          submitBtn.disabled = false;
          submitBtn.innerText = "Enviar Preinscripció (20 €)";

          if (result.success) {
            alertSuccess.innerText = "Gràcies! Hem rebut la teva preinscripció (" + result.id + "). T'hem enviat un correu amb les instruccions de pagament.";
            alertSuccess.style.display = 'block';
            form.reset();
          } else {
            alertError.innerText = "Error: " + (result.error || "No s'ha pogut processar la inscripció.");
            alertError.style.display = 'block';
          }
        })
        .catch(error => {
          console.error(error);
          submitBtn.disabled = false;
          submitBtn.innerText = "Enviar Preinscripció (20 €)";
          alertError.innerText = "S'ha produït un error de connexió amb el servidor.";
          alertError.style.display = 'block';
        });

      }).catch(function(err) {
        console.error(err);
        submitBtn.disabled = false;
        submitBtn.innerText = "Enviar Preinscripció (20 €)";
        alertError.innerText = "Error en la verificació antispam de reCAPTCHA.";
        alertError.style.display = 'block';
      });
    });
  });
</script>

</body>
</html>
